<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
        }
        .admin-container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .admin-header { text-align: center; margin-bottom: 2rem; }
        .admin-header h1 { font-size: 2.5rem; background: linear-gradient(135deg, #e63946, #ff6b6b); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .card { background: rgba(30,30,42,0.95); border-radius: 24px; padding: 2rem; margin-bottom: 2rem; border: 1px solid rgba(230,57,70,0.2); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-weight: 600; font-size: 0.8rem; text-transform: uppercase; color: #9ca3af; }
        .input-group input, .input-group select, .input-group textarea {
            padding: 12px 16px; border-radius: 16px; border: 1.5px solid #2c2c38;
            background: #1e1e2a; color: #e0e0e0; font-family: inherit; outline: none;
        }
        .input-group input:focus { border-color: #e63946; box-shadow: 0 0 0 3px rgba(230,57,70,0.2); }
        .btn { background: linear-gradient(135deg, #e63946, #c1121f); border: none; color: white; padding: 12px 28px; border-radius: 40px; font-weight: 700; cursor: pointer; margin-right: 1rem; }
        .btn-secondary { background: linear-gradient(135deg, #4a5568, #2d3748); }
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .movie-card { background: #1e1e2a; border-radius: 20px; overflow: hidden; border: 1px solid #2c2c38; }
        .movie-card img { width: 100%; height: 150px; object-fit: cover; }
        .movie-info { padding: 1rem; }
        .movie-title { font-weight: 700; margin-bottom: 5px; }
        .movie-actions { display: flex; gap: 10px; margin-top: 10px; }
        .edit-btn, .delete-btn { flex: 1; padding: 8px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; }
        .edit-btn { background: #2ecc71; color: white; }
        .delete-btn { background: #e63946; color: white; }
        .status-msg { background: rgba(230,57,70,0.15); padding: 1rem; border-radius: 16px; text-align: center; margin-top: 1rem; }
        .pin-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }
        .pin-box {
            background: #1e1e2a; padding: 2rem; border-radius: 30px;
            text-align: center; border: 1px solid #e63946;
        }
        .pin-box input { padding: 15px; font-size: 1.5rem; text-align: center; border-radius: 20px; border: none; background: #2c2c38; color: white; margin: 1rem 0; }
        .episode-card { background: #2a2a2e; border-radius: 12px; padding: 1rem; margin-bottom: 0.5rem; }
        @media (max-width: 768px) { .admin-container { padding: 1rem; } .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div id="pinOverlay" class="pin-overlay">
    <div class="pin-box">
        <i class="fas fa-lock" style="font-size: 3rem; color: #e63946;"></i>
        <h2>Admin Access Required</h2>
        <p>Enter PIN to continue</p>
        <input type="password" id="pinInput" maxlength="6" placeholder="Enter PIN">
        <div>
            <button id="pinSubmitBtn" class="btn">Verify</button>
        </div>
        <p id="pinError" style="color: #e63946; margin-top: 1rem; display: none;">Invalid PIN!</p>
    </div>
</div>

<div id="adminContent" style="display: none;">
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-user-shield"></i> CineMax Admin Panel</h1>
            <p>Manage Movies, TV Series, Episodes | Powered by MongoDB + Gofile</p>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 1.5rem;"><i class="fas fa-plus-circle"></i> Add / Edit Movie</h2>
            <div class="form-grid">
                <div class="input-group"><label>Title *</label><input type="text" id="title" placeholder="Movie title"></div>
                <div class="input-group"><label>Year</label><input type="number" id="year" value="2026"></div>
                <div class="input-group"><label>Rating</label><input type="number" step="0.1" id="rating" value="8.5"></div>
                <div class="input-group"><label>Quality</label><input type="text" id="quality" placeholder="4K, 1080p"></div>
                <div class="input-group"><label>Genre</label><input type="text" id="genre" placeholder="Action, Drama"></div>
                <div class="input-group"><label>Language</label><input type="text" id="language" placeholder="English"></div>
                <div class="input-group"><label>Type</label><select id="type"><option value="movie">🎬 Movie</option><option value="tv">📺 TV Series</option></select></div>
                <div class="input-group"><label><input type="checkbox" id="trending"> 🔥 Trending</label></div>
                <div class="input-group"><label><input type="checkbox" id="latest"> 🆕 Latest</label></div>
                <div class="input-group"><label>Poster URL</label><input type="text" id="poster" placeholder="https://..."></div>
                <div class="input-group"><label>Direct Video URL</label><input type="text" id="videoUrl" placeholder="https://..."></div>
                <div class="input-group"><label>Telegram Link</label><input type="text" id="telegramLink" placeholder="https://t.me/..."></div>
                <div class="input-group"><label>Drive Link</label><input type="text" id="driveLink" placeholder="https://drive.google.com/..."></div>
                <div class="input-group"><label>Description</label><textarea id="description" rows="3"></textarea></div>
            </div>
            
            <div id="episodesSection" style="display: none; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #2c2c38;">
                <h3><i class="fas fa-tv"></i> Episodes</h3>
                <div id="episodesList"></div>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem;">
                    <input type="number" id="epSeason" placeholder="Season" style="padding: 10px; border-radius: 12px; background: #2a2a2e; border: none; color: white;">
                    <input type="number" id="epNumber" placeholder="Episode" style="padding: 10px; border-radius: 12px; background: #2a2a2e; border: none; color: white;">
                    <input type="text" id="epTitle" placeholder="Episode Title" style="padding: 10px; border-radius: 12px; background: #2a2a2e; border: none; color: white; flex: 1;">
                    <input type="text" id="epVideoUrl" placeholder="Video URL" style="padding: 10px; border-radius: 12px; background: #2a2a2e; border: none; color: white; flex: 1;">
                    <button id="addEpisodeBtn" class="btn" style="margin: 0;">+ Add</button>
                </div>
            </div>
            
            <div style="margin-top: 1.5rem;">
                <button class="btn" id="saveBtn"><i class="fas fa-save"></i> Save Movie</button>
                <button class="btn btn-secondary" id="clearBtn"><i class="fas fa-eraser"></i> Clear</button>
            </div>
            <input type="hidden" id="editId">
            <div id="statusMsg" class="status-msg" style="display: none;"></div>
        </div>

        <div class="card">
            <h2><i class="fas fa-database"></i> All Movies</h2>
            <div id="moviesGrid" class="movies-grid"></div>
        </div>
    </div>
</div>

<script>
    const ADMIN_PIN = '200727';
    const API_URL = window.location.origin + '/api';
    let moviesArray = [];
    let tempEpisodes = [];
    let currentEditId = null;

    // PIN Verification
    function verifyPin() {
        const pin = document.getElementById('pinInput').value;
        if (pin === ADMIN_PIN) {
            localStorage.setItem('admin_auth', 'true');
            document.getElementById('pinOverlay').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadMovies();
        } else {
            document.getElementById('pinError').style.display = 'block';
        }
    }

    // Check existing auth
    if (localStorage.getItem('admin_auth') === 'true') {
        document.getElementById('pinOverlay').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadMovies();
    }

    document.getElementById('pinSubmitBtn').addEventListener('click', verifyPin);
    document.getElementById('pinInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyPin(); });

    // API Helper with auth
    async function apiCall(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                'x-admin-pin': ADMIN_PIN,
                ...options.headers
            }
        });
        if (!response.ok) throw new Error(await response.text());
        return response.json();
    }

    async function loadMovies() {
        try {
            const response = await fetch(`${API_URL}/movies`);
            moviesArray = await response.json();
            renderMoviesGrid();
        } catch (error) {
            console.error(error);
            showStatus('Error loading movies: ' + error.message, 'error');
        }
    }

    function renderMoviesGrid() {
        const container = document.getElementById('moviesGrid');
        if (!moviesArray.length) {
            container.innerHTML = '<p style="text-align: center;">No movies yet. Add your first movie!</p>';
            return;
        }
        container.innerHTML = moviesArray.map(movie => `
            <div class="movie-card">
                <img src="${movie.posterImg || 'https://via.placeholder.com/300x150/1a1a2e/e63946?text=No+Poster'}" onerror="this.src='https://via.placeholder.com/300x150/1a1a2e/e63946?text=No+Poster'">
                <div class="movie-info">
                    <div class="movie-title">${escapeHtml(movie.title)}</div>
                    <div style="font-size: 0.8rem; color: #9ca3af;">${movie.genre || ''} | ${movie.year || ''} | ${movie.type}</div>
                    <div class="movie-actions">
                        <button class="edit-btn" onclick="editMovie('${movie._id}')"><i class="fas fa-edit"></i> Edit</button>
                        <button class="delete-btn" onclick="deleteMovie('${movie._id}')"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function editMovie(id) {
        const movie = moviesArray.find(m => m._id === id);
        if (!movie) return;
        currentEditId = id;
        document.getElementById('title').value = movie.title || '';
        document.getElementById('year').value = movie.year || '';
        document.getElementById('rating').value = movie.rating || '';
        document.getElementById('quality').value = movie.quality || '';
        document.getElementById('genre').value = movie.genre || '';
        document.getElementById('language').value = movie.language || '';
        document.getElementById('type').value = movie.type || 'movie';
        document.getElementById('trending').checked = movie.isTrending || false;
        document.getElementById('latest').checked = movie.isLatest || false;
        document.getElementById('poster').value = movie.posterImg || '';
        document.getElementById('videoUrl').value = movie.videoUrl || movie.directLink || '';
        document.getElementById('telegramLink').value = movie.telegramLink || '';
        document.getElementById('driveLink').value = movie.driveLink || '';
        document.getElementById('description').value = movie.description || '';
        document.getElementById('editId').value = id;
        
        tempEpisodes = movie.episodes ? [...movie.episodes] : [];
        renderEpisodesList();
        toggleEpisodesSection();
        showStatus(`Editing: ${movie.title}`, 'success');
    }

    async function deleteMovie(id) {
        if (!confirm('Are you sure you want to delete this movie?')) return;
        try {
            await apiCall(`${API_URL}/movies/${id}`, { method: 'DELETE' });
            showStatus('Movie deleted successfully!', 'success');
            loadMovies();
            clearForm();
        } catch (error) {
            showStatus('Error deleting movie: ' + error.message, 'error');
        }
    }

    function toggleEpisodesSection() {
        const type = document.getElementById('type').value;
        const section = document.getElementById('episodesSection');
        section.style.display = type === 'tv' ? 'block' : 'none';
        if (type !== 'tv') tempEpisodes = [];
        renderEpisodesList();
    }

    function renderEpisodesList() {
        const container = document.getElementById('episodesList');
        if (!tempEpisodes.length) {
            container.innerHTML = '<p>No episodes added yet.</p>';
            return;
        }
        const seasons = {};
        tempEpisodes.forEach(ep => {
            if (!seasons[ep.season]) seasons[ep.season] = [];
            seasons[ep.season].push(ep);
        });
        let html = '';
        for (let s in seasons) {
            html += `<div style="margin-bottom: 1rem;"><strong>Season ${s}</strong>`;
            seasons[s].forEach((ep, idx) => {
                html += `<div class="episode-card">
                            Episode ${ep.episode}: ${ep.title || 'Untitled'}
                            <button onclick="removeEpisode(${idx})" style="float: right; background: #e63946; border: none; color: white; padding: 4px 12px; border-radius: 20px; cursor: pointer;">Remove</button>
                         </div>`;
            });
            html += `</div>`;
        }
        container.innerHTML = html;
    }

    function removeEpisode(index) {
        tempEpisodes.splice(index, 1);
        renderEpisodesList();
    }

    function addEpisode() {
        const season = parseInt(document.getElementById('epSeason').value);
        const episode = parseInt(document.getElementById('epNumber').value);
        const title = document.getElementById('epTitle').value;
        const videoUrl = document.getElementById('epVideoUrl').value;
        
        if (isNaN(season) || isNaN(episode)) {
            alert('Season and Episode numbers are required');
            return;
        }
        
        tempEpisodes.push({
            id: Date.now().toString(),
            season,
            episode,
            title,
            videoUrl,
            directLink: videoUrl,
            views: 0
        });
        
        document.getElementById('epSeason').value = '';
        document.getElementById('epNumber').value = '';
        document.getElementById('epTitle').value = '';
        document.getElementById('epVideoUrl').value = '';
        renderEpisodesList();
        showStatus('Episode added. Click Save to commit.', 'success');
    }

    async function saveMovie() {
        const title = document.getElementById('title').value.trim();
        if (!title) {
            alert('Title is required');
            return;
        }
        
        const movieData = {
            title,
            year: parseInt(document.getElementById('year').value) || 2025,
            rating: parseFloat(document.getElementById('rating').value) || 7.0,
            quality: document.getElementById('quality').value || 'HD',
            genre: document.getElementById('genre').value || '',
            language: document.getElementById('language').value || 'English',
            type: document.getElementById('type').value,
            isTrending: document.getElementById('trending').checked,
            isLatest: document.getElementById('latest').checked,
            posterImg: document.getElementById('poster').value || '',
            videoUrl: document.getElementById('videoUrl').value || '',
            directLink: document.getElementById('videoUrl').value || '',
            telegramLink: document.getElementById('telegramLink').value || '',
            driveLink: document.getElementById('driveLink').value || '',
            description: document.getElementById('description').value || '',
            episodes: document.getElementById('type').value === 'tv' ? tempEpisodes : []
        };
        
        const editId = document.getElementById('editId').value;
        let url = `${API_URL}/movies`;
        let method = 'POST';
        
        if (editId && editId !== 'undefined') {
            movieData.id = editId;
        }
        
        try {
            const response = await fetch(url, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-pin': ADMIN_PIN
                },
                body: JSON.stringify(movieData)
            });
            
            if (!response.ok) throw new Error(await response.text());
            const result = await response.json();
            showStatus(`✅ "${title}" saved successfully!`, 'success');
            clearForm();
            loadMovies();
        } catch (error) {
            showStatus('Error saving: ' + error.message, 'error');
        }
    }

    function clearForm() {
        document.getElementById('title').value = '';
        document.getElementById('year').value = '2026';
        document.getElementById('rating').value = '8.5';
        document.getElementById('quality').value = '';
        document.getElementById('genre').value = '';
        document.getElementById('language').value = '';
        document.getElementById('type').value = 'movie';
        document.getElementById('trending').checked = false;
        document.getElementById('latest').checked = false;
        document.getElementById('poster').value = '';
        document.getElementById('videoUrl').value = '';
        document.getElementById('telegramLink').value = '';
        document.getElementById('driveLink').value = '';
        document.getElementById('description').value = '';
        document.getElementById('editId').value = '';
        tempEpisodes = [];
        renderEpisodesList();
        toggleEpisodesSection();
        showStatus('Form cleared. Ready for new movie.', 'success');
    }

    function showStatus(msg, type) {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = msg;
        statusDiv.style.background = type === 'error' ? 'rgba(230,57,70,0.2)' : 'rgba(0,184,148,0.2)';
        setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    document.getElementById('saveBtn').addEventListener('click', saveMovie);
    document.getElementById('clearBtn').addEventListener('click', clearForm);
    document.getElementById('type').addEventListener('change', toggleEpisodesSection);
    document.getElementById('addEpisodeBtn').addEventListener('click', addEpisode);
    
    window.editMovie = editMovie;
    window.deleteMovie = deleteMovie;
    window.removeEpisode = removeEpisode;
</script>
</body>
</html>
